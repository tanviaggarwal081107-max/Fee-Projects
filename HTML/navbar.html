<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-size: 1.2rem;
        }

        body {
            min-height: 100vh;
        }

        header {
            padding: 10px;
            height: 10vh;
            background-color: #0F172A;
            display: flex;
            align-items: center;
        }

        header nav {
            color: #60A5FA;
        }

        section {
            display: flex;
            justify-content: space-between;
        }

        aside {
            padding: 10px;
            height: 80vh;
            width: 20%;
            background-color: brown;
            color: white;
        }

        main {
            padding: 10px;
            height: 80vh;
            width: 60%;
            background-color: #03d0d3;
            color: #3B2F35;
        }

        article {
            padding: 10px;
            height: 80vh;
            width: 20%;
            background-color: #C9A27E;
            color: #3B2F2F;
        }

        footer {
            padding: 10px;
            height: 10vh;
            background-color: #111827;
            display: flex;
            align-items: center;
        }

        footer nav {
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <nav>Navigation Links</nav>
    </header>

    <section>

        <aside>
            SideBar
        </aside>

        <main>
            Main Content
        </main>

        <article>
            Article
        </article>

    </section>

    <footer>
        <nav>Tanvi-1253</nav>
    </footer>

</body>

</html>
