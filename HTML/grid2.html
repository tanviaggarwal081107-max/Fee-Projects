<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background-color:#f4f4f4;
        }

        .box{
            border:2px solid black;
            background-color:lightblue;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:2rem;
        }

        .gc{
            display:grid;
            gap:0.5rem;
            grid-template-columns:150px 150px 150px;
            grid-template-rows:150px 150px 150px;
            place-content:center;
        }

        #m1{
            grid-column:1/2;
            grid-row:1/2;
        }

        #m2{
            grid-column:3/4;
            grid-row:1/3;
        }

        #m3{
            grid-column:1/2;
            grid-row:2/4;
        }

        #m4{
            grid-column:2/3;
            grid-row:1/3;
        }

        #m5{
            grid-column:2/4;
            grid-row:3/4;
        }

        @media(min-width:767px){
            .gc{
                grid-template-columns:minmax(175px,225px)
                                     minmax(225px,275px)
                                     minmax(175px,225px);

                grid-template-rows:175px 175px 175px;
            }
        }

        @media(min-width:1024px){
            .gc{
                grid-template-columns:minmax(250px,350px)
                                     minmax(300px,400px)
                                     minmax(250px,350px);

                grid-template-rows:175px 175px 175px;
            }
        }
    </style>
</head>

<body>

    <section class="box" style="height:10vh;">
        <span style="font-size:2.5rem;">CSS Grid Layout</span>
    </section>

    <section class="gc" style="height:80vh; background:white;">

        <main class="box" id="m1">
            1
        </main>

        <main class="box" id="m2">
            2
        </main>

        <main class="box" id="m3">
            3
        </main>

        <main class="box" id="m4">
            4
        </main>

        <main class="box" id="m5">
            5
        </main>

    </section>

</body>
</html>
